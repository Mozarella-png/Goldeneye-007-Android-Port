plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goldeneye007.port'
    compileSdk 34
    // Pinned on purpose: CI installs this exact NDK.
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.goldeneye007.port'
        minSdk 26            // Android 8.0: OpenGL ES 3.0 guaranteed
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_ARM_NEON=TRUE',
                          "-DGE_BUILD_PORT=${project.findProperty('geBuildPort') ?: 'OFF'}"
                cppFlags '-std=c++20'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // SDL2's Java glue (org.libsdl.app.*) is copied in by CI, see .github/workflows/android.yml
}
